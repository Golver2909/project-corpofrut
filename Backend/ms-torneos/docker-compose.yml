version: "3.9"

services:
  postgres-torneos:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: torneos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_torneos_data:/var/lib/postgresql/data


volumes:
  postgres_torneos_data: