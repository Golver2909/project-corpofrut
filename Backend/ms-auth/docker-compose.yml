services:
  mysql:
    image: mysql:8.4
    container_name: ms-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ms_auth
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - ms_auth_mysql_data:/var/lib/mysql

volumes:
  ms_auth_mysql_data: